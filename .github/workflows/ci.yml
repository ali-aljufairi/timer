name: timer regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: timer-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    name: timer node and Socket.IO regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Use the runner-provided Chrome and matching ChromeDriver
        run: |
          echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
          google-chrome --version
          chromedriver --version
      - run: npm ci
      - run: npm test
      - name: Exercise timer UI in two real browser clients
        run: npm run test:browser
      - name: Preserve browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timer-browser-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
