apiVersion: v1
kind: Namespace
metadata:
  name: timer
  labels:
    app.kubernetes.io/name: sync-timer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sync-timer
  namespace: timer
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-timer
  namespace: timer
  labels:
    app.kubernetes.io/name: sync-timer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sync-timer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sync-timer
    spec:
      serviceAccountName: sync-timer
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: timer
          image: sync-timer:1.0.0
          imagePullPolicy: Never
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: MAX_ACTIVE_ROOMS
              value: "250"
            - name: MAX_CONNECTIONS
              value: "500"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: sync-timer
  namespace: timer
  labels:
    app.kubernetes.io/name: sync-timer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sync-timer
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-rate-limit
  namespace: timer
spec:
  rateLimit:
    average: 30
    burst: 60
    period: 1m
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: timer
spec:
  headers:
    contentSecurityPolicy: "default-src 'self'; connect-src 'self' wss:; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    contentTypeNosniff: true
    frameDeny: true
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
    referrerPolicy: no-referrer
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sync-timer
  namespace: timer
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: timer-public-rate-limit@kubernetescrd,timer-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: timer.aljufairi.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sync-timer
                port:
                  number: 80
  tls:
    - hosts:
        - timer.aljufairi.org
      secretName: sync-timer-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sync-timer-ingress
  namespace: timer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sync-timer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 3000
          protocol: TCP
